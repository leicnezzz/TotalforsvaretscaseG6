services:
  totalforsvaret:
    image: ${DOCKER_REGISTRY-}totalforsvaret
    build:
      context: .
      dockerfile: Totalforsvaret/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: test1234
      MARIADB_DATABASE: totalforsvaret
    ports:
      - "3308:3306"
    volumes:
      - mariadbdata:/var/lib/mysql

volumes:
  mariadbdata: