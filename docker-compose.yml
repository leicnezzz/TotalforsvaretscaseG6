services:
  totalforsvaret:
    image: ${DOCKER_REGISTRY-}totalforsvaret
    build:
      context: .
      dockerfile: Totalforsvaret/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: gruppe6
      MARIADB_DATABASE: totalforsvaret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: